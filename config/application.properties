site.url=${roq.site-url:https://arquillian.org}
site.page-layout=page
site.generator=true
quarkus.qute.alt-expr-syntax=true
roq.cache-directory=${ROQ_CACHE_DIRECTORY:.roq-cache}
roq.refresh=${ROQ_REFRESH:false}
roq.profile=${ROQ_PROFILE:development}
roq.generator.batch=${ROQ_GENERATOR_BATCH:false}
site.collections.posts.layout=post
site.collections.posts.future=true
site.collections.posts.link=/:collection/:year/:month/:name/
