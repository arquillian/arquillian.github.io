name: Roq static artifact

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: roq
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Eclipse Temurin JDK
        run: |
          test "$(cat .java-version)" = '25.0.5+8'
          curl --fail --silent --show-error --location 'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz' --output "$RUNNER_TEMP/temurin-jdk.tar.gz"
          printf '%s  %s\n' '68982529869257d0ee6b824ec5aa270ff8b118bb438670da0b97ebdab178d7fb' "$RUNNER_TEMP/temurin-jdk.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/temurin-25"
          tar --extract --gzip --file "$RUNNER_TEMP/temurin-jdk.tar.gz" --directory "$RUNNER_TEMP/temurin-25" --strip-components=1
          echo "JAVA_HOME=$RUNNER_TEMP/temurin-25" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/temurin-25/bin" >> "$GITHUB_PATH"
      - name: Compile main and test sources
        run: ./mvnw -B -ntp compile test-compile
      - name: Test snapshot rendering and refresh fixtures
        run: ./mvnw -B -ntp test
      - name: Export static site
        run: ./mvnw -B -ntp -DskipTests -Dquarkus.roq.generator.batch=true package quarkus:run
      - name: Verify artifact hosting files and shared assets
        run: |
          test -s target/roq/index.html
          test -s target/roq/404.html
          cmp ../CNAME target/roq/CNAME
          test -f target/roq/.nojekyll
          cmp ../.nojekyll target/roq/.nojekyll
          cmp public/stylesheets/screen.css target/roq/stylesheets/screen.css
          cmp public/stylesheets/dashboard.css target/roq/stylesheets/dashboard.css
          cmp ../images/header_icons.png target/roq/images/header_icons.png
          cmp ../javascripts/site.js target/roq/javascripts/site.js
      - name: Upload reviewable static site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arquillian-roq-site
          path: roq/target/roq/
          if-no-files-found: error
          include-hidden-files: true
