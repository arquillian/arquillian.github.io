<div id="content">
  <div class="row">
    <div class="span9">
      <div class="hero-unit">
        <div class="row">
          <div class="pull-left">
            <img src="{=profile.avatar_url}" height="120" width="120" alt="{=profile.name}" style="padding:5px;">
          </div>
          <h2>{=profile.company} <small>{=profile.location}</small></h2>
          <div class="bio">{=profile.bio_html.raw}</div>
        </div>
      </div>
    </div>
    <div class="span3">
      <div class="well">
        {#if profile.role}<h4><i class="icon-star"></i> {=profile.role}</h4>{/if}
        <dl class="unstyled">
          {#for social in profile.profiles}
          <dt>{=social.label}</dt>
          <dd>{=social.html.raw}</dd>
          {/for}
          {#if profile.teams.size > 0}
          <dd>{#for team in profile.teams}<span class="greenbar">{=team}</span> {/for}</dd>
          {/if}
        </dl>
      </div>
    </div>
  </div>
</div>
