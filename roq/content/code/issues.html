---
layout: default
title: Issue Activity
javascripts: [ /javascripts/siphon-20120407.js ]
link: /code/issues/
---
{|
<div id="content">
          <p>Below is a feed of the latest activity stream from the Arquillian issue tracker.</p>
          <script id="issues-tmpl" type="text/x-jsquery">
            <tr>
              <td>
                <p style="margin-bottom: 1em;">
                  <a href="{{:link}}">{{:title}}</a>
                </p>
                <p style="margin-bottom: .5em; border-left: 3px solid #ccc; font-style: italic; padding-left: 5px">{{:contentSnippet}}</p>
              </td>
            </tr>
          </script>
          <table class="table table-striped" id="issues">
            <tbody></tbody>
          </table>
          <p>
            <a href="https://issues.jboss.org/browse/ARQ">See more activity by visiting the Arquillian issue tracker &raquo;</a>
          </p>
        </div>
<script>
// TODO clean this up with datejs: http://www.datejs.com
Date.prototype.monthNames = [ "January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December" ];
Date.prototype.getUTCMonthName = function() {
  return this.monthNames[this.getUTCMonth()];
};
Date.prototype.getUTCShortMonthName = function() {
  return this.getUTCMonthName().substr(0, 3);
};
$.jGFeed(encodeURI('http://issues.jboss.org/activity?streams=key+IS+ARQ'),
  function(feeds) {
    if (!feeds) {
      return false;
    }
    $.each(feeds.entries, function(idx, entry) {
      var d = new Date(entry.publishedDate);
      entry.publishedDateMonth = d.getUTCShortMonthName();
      entry.publishedDateOfMonth = d.getUTCDate();
      if (entry.publishedDateOfMonth < 10) {
        entry.publishedDateOfMonth = '0' + entry.publishedDateOfMonth;
      }
    });
    $('#issues tbody').html($('#issues-tmpl').render(feeds.entries));
  }, 15);
</script>
|}
