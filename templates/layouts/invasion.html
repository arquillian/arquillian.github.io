{#include roq-templates/layouts/base}
{#fragment RoqPageContent}
<div id="main" role="main">
    <div id="content-header">
        <div class="container">
            <h1>{=page.title}</h1>
        </div>
    </div>
    <div class="container">
        <div id="sidebar" class="row-col">
            <div class="tab-group"><ul class="nav nav-tabs" id="tab">
                <li class="nav-item{#if page.title == 'Arquillian Invasion!'} active{/if}"><a class="nav-link{#if page.title == 'Arquillian Invasion!'} active{/if}" href="/invasion/">Mission</a></li>
                <li class="nav-item{#if page.url.startsWith('/invasion/team')} active{/if}"><a class="nav-link{#if page.url.startsWith('/invasion/team')} active{/if}" href="/invasion/team">Team</a></li>
                <li class="nav-item{#if page.url.startsWith('/invasion/origins')} active{/if}"><a class="nav-link{#if page.url.startsWith('/invasion/origins')} active{/if}" href="/invasion/origins">Origins</a></li>
                <li class="nav-item{#if page.url.startsWith('/invasion/buzz')} active{/if}"><a class="nav-link{#if page.url.startsWith('/invasion/buzz')} active{/if}" href="/invasion/buzz">Buzz</a></li>
                <li class="nav-item{#if page.url.startsWith('/invasion/events')} active{/if}"><a class="nav-link{#if page.url.startsWith('/invasion/events')} active{/if}" href="/invasion/events">Events</a></li>
                <li class="nav-item{#if page.url.startsWith('/invasion/press')} active{/if}"><a class="nav-link{#if page.url.startsWith('/invasion/press')} active{/if}" href="/invasion/press">Press</a></li>
                <li class="nav-item{#if page.url.startsWith('/invasion/videos')} active{/if}"><a class="nav-link{#if page.url.startsWith('/invasion/videos')} active{/if}" href="/invasion/videos">Videos</a></li>
                <li class="nav-item{#if page.url.startsWith('/invasion/spread')} active{/if}"><a class="nav-link{#if page.url.startsWith('/invasion/spread')} active{/if}" href="/invasion/spread">Spread Ike!</a></li>
            </ul></div>
        </div>
        <div id="content" class="row-col">{#insert /}</div>
    </div>
</div>
{/fragment}
{/include}
