<!DOCTYPE html>
<html lang="{=page.data.language.or('en')}">
<head>
    <meta charset="utf-8">
    <title>{#if page.data('browser_title')}{=page.data.browser_title}{#else}{=page.title} · {=page.data('site_title','Arquillian')}{/if}</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="{=page.data.description.or('An innovative testing platform for the Java Virtual Machine (JVM). Open source. Highly extensible.')}" name="description">
    <link href="/blog/atom.xml" rel="alternate" title="Arquillian blog Atom feed" type="application/atom+xml">
    <link href="/stylesheets/screen.css?e0e71a3a85916364d66959de2468e50cc63bbf50" rel="stylesheet">
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/1.7.2/jquery.min.js"></script>
    {#if page.data('stylesheets')}
    {#for stylesheet in page.data.stylesheets}<link href="{=stylesheet}" rel="stylesheet">{/for}
    {/if}
    <!--[if lt IE 9]>
      <script src="//cdnjs.cloudflare.com/ajax/libs/html5shiv/r29/html5.js"></script>
    <![endif]-->
    {#if page.data('javascripts')}
    {#for javascript in page.data.javascripts}<script src="{=javascript}"></script>{/for}
    {/if}
    <link href="/favicon.ico" rel="shortcut icon">
  
<link rel="canonical" href="{=page.url.absolute}">
{#insert head /}
</head>
<body class="{=page.data.body_class.or('')}">
{#include partials/header.html /}
{#insert /}
{#include partials/footer.html /}
</body>
</html>
