{#include roq-templates/layouts/blog}
{#fragment RoqPageContent}
    <article class="post">
        <header class="header">
            <h2 class="title"><a href="{=page.url}">{=page.title}</a></h2>
            <div class="meta">
                <time datetime="{=page.date}">{=page.date}</time>
                {#if page.data.author}<span class="author"> by {=page.data.author}</span>{/if}
            </div>
        </header>
        <div class="body">{#insert /}</div>
        {#if page.data.tags}
        <ul class="tags">
            {#for tag in page.data.tags}<li><a href="/blog/?tag={=tag}">{=tag}</a></li>{/for}
        </ul>
        {/if}
        <div class="footer"><a href="{=page.url}">permalink</a></div>
    </article>
    <ul class="pager">
        <li class="pages">Arquillian Blog</li>
    </ul>
{/fragment}
{/include}
