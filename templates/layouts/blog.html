{#include roq-templates/layouts/default}

    <div class="container">
        <div id="content">
            {#insert /}
        </div>
        <aside id="sidebar" role="complementary">
            <div class="subscribe">
                <h2 class="icon news"><a href="/blog/atom.xml">Subscribe to the Arquillian Blog</a></h2>

            </div>
            <nav class="latest"><h2>Latest Posts</h2></nav>
            <nav class="tags"><h2>Tags</h2></nav>

    </div>
</main>
{/fragment}
{/include}
