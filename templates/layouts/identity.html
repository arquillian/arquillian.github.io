{#include roq-templates/layouts/base}
{#fragment RoqPageContent}
<main id="main" role="main">
    <section id="content-header"><div class="container"><h1>{=generated.title}</h1></div></section>
    <div class="container generated-page generated-identity">
        <div class="row">
            <div class="span9">
                {#if generated.model.avatarUrl}<img src="{=generated.model.avatarUrl}" alt="{=generated.model.name}" width="120" height="120">{/if}
                <h2>{=generated.model.name}</h2>
                <p>{=generated.model.company} {=generated.model.location}</p>
                <p>{=generated.model.bio}</p>
            </div>
            <aside class="span3"><div class="well">
                <h4><i class="icon-star"></i> {=generated.model.role}</h4>
                <a href="https://github.com/{=generated.model.githubId}">GitHub</a>
            </div></aside>
        </div>
    </div>
</main>
{/fragment}
{/include}
