---
layout: invasion
title: Videos
link: /invasion/videos/
javascripts: [ /javascripts/siphon-20120407.js ]
---
<script id="video_tmpl" type="text/x-jsrender"><div class="video"><div class="preview"><a class="thumbnail" href="{{:url}}" target="_blank" title="{{:title}}" rel="popover" data-raw="Duration: {{:~format_duration(duration)}}+ Number of plays: {{:stats_number_of_plays}}+ Tags: {{:tags}}"><img src="{{:thumbnail_large}}" alt="{{:title}}"></a></div><div class="desc"><h3>{{:title}}</h3><p>{{:~truncate(description, 400)}}</p></div></div>{{if ~not_last()}}<hr class="taper">{{/if}}</script>
<h2>Arquillian Videos on Vimeo</h2><div id="videos"></div>
<script>
  $.views.helpers({
    truncate: function(val, len) { return val.length < len ? val : val.substr(0, len) + '...'; },
    not_last: function() { return this.index !== this.parent.data.length - 1; },
    format_duration: function(seconds) { var duration = Math.floor(seconds / 60) + 'm', remainder = seconds % 60; return remainder > 0 ? duration + ' ' + remainder + 's' : duration; }
  });
  $.ajax({url: 'https://vimeo.com/api/v2/channel/arquillian/videos.json', dataType: 'jsonp', jsonp: 'callback', jsonpCallback: 'display_videos'});
  function display_videos(data) { $('#videos').html($('#video_tmpl').render(data)); $('#videos a[rel=popover]').popover({content: function() { return $(this).attr('data-raw').replace(/\+ /g, '<br/>'); }}); }
</script>
